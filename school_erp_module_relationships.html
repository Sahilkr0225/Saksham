<h2 class="sr-only">Diagram showing how all 20 school ERP modules connect to each other, grouped by Foundation, Core ERP, Communication, and Analytics layers</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#AFA9EC' : '#534AB7',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    clusterBkg: 'transparent',
    clusterBorder: dark ? '#5F5E5A' : '#B4B2A9'
  },
  flowchart: { curve: 'basis', htmlLabels: true, nodeSpacing: 30, rankSpacing: 45 }
});
const graph = `graph TD
  subgraph Foundation
    AUTH[Auth and User Mgmt]
    RBAC[RBAC]
    AUDIT[Audit Logs]
    ADMIN[Administration and Settings]
  end
  subgraph CoreERP[Core ERP]
    ACAD[Academic Structure]
    ADM[Admissions]
    STU[Student Mgmt]
    PAR[Parent Mgmt]
    TEA[Teacher Mgmt]
    ATT[Attendance]
    HW[Homework and Assignments]
    EXAM[Exams and Results]
    FEE[Fee Management]
    DOC[Document Mgmt]
    HELP[Help and Support]
    GAL[Gallery and Media]
    CMS[Public Website CMS]
  end
  subgraph Communication
    NOTC[Notices and Events]
    NOTIF[Notification Engine]
  end
  subgraph Analytics
    REP[Reports and Analytics]
  end

  AUTH --> RBAC
  AUTH --> AUDIT
  AUTH --> STU
  AUTH --> PAR
  AUTH --> TEA
  AUTH --> HELP
  AUTH --> GAL
  AUTH --> CMS
  AUTH --> NOTIF

  ACAD --> ADM
  ACAD --> STU
  ACAD --> ATT
  ACAD --> HW
  ACAD --> EXAM
  ACAD --> FEE

  ADM --> STU
  ADM --> DOC
  STU --> PAR
  STU --> ATT
  STU --> HW
  STU --> EXAM
  STU --> FEE

  TEA --> HW
  TEA --> ATT
  TEA --> EXAM

  HW --> DOC

  ATT --> REP
  EXAM --> REP
  FEE --> REP

  NOTC --> NOTIF

  ADMIN -.-> ACAD
  ADMIN -.-> FEE
`;
const { svg } = await mermaid.render('erd-svg', graph);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg .node rect, #erd svg .node polygon').forEach(el => {
  if (el.tagName === 'rect') el.setAttribute('rx', '8');
});
</script>
